# ComputeClass configured for GKE Agent Sandbox workloads using gVisor.
#
# Workloads requesting this class receive kernel-level sandboxing via gVisor (runsc)
# while GKE node pool auto-creation provisions nodes from an On-Demand priority ladder.
#
# IMPORTANT: Align machineType / machineFamily priority order with your existing CUDs/Reservations.
#
# The priority ladder evaluates right-sized standard shapes across 5 modern x86 families
# (c4, n4, c3, n4d, n2) before falling through to larger shapes, ending with a bounded
# family catch-all to guarantee elasticity while preventing unbounded shape proliferation.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: agent-sandbox-gvisor
spec:
  nodePoolConfig:
    sandbox:
      type: gvisor
    nodeLabels:
      workload-type: agent-sandbox
  priorities:
  # Tier 1: 8-core compute & general-purpose shapes
  - machineType: c4-standard-8
  - machineType: n4-standard-8
  - machineType: c3-standard-8
  - machineType: n4d-standard-8
  - machineType: n2-standard-8
  # Tier 2: 16-core shapes for higher pod packing density
  - machineType: c4-standard-16
  - machineType: n4-standard-16
  - machineType: c3-standard-16
  - machineType: n2-standard-16
  # Tier 3: Bounded family catch-all for broad availability
  - machineFamily: n2
    minCores: 8
    minMemoryGb: 32
  activeMigration:
    optimizeRulePriority: true
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
