# GKE Agent Sandbox manifests demonstrating SandboxTemplate, SandboxWarmPool, and SandboxClaim.
#
# These manifests strictly adhere to GKE's sandbox-core-policy ValidatingAdmissionPolicy:
# 1. runtimeClassName must be 'gvisor' (or 'microvm')
# 2. automountServiceAccountToken must be explicitly false
# 3. securityContext must enforce runAsNonRoot: true and drop all capabilities
# 4. hostNetwork, hostPID, hostIPC, and privileged must NOT be enabled
# 5. nodeSelector must include 'sandbox.gke.io/runtime: gvisor' (and targets our ComputeClass)
# 6. tolerations must include a toleration for 'sandbox.gke.io/runtime=gvisor:NoSchedule'
# 7. memory requests must satisfy the GKE Autopilot 1 GiB/vCPU ratio (e.g. 500m CPU -> >= 512Mi memory)
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: python-agent-gvisor-template
  namespace: default
spec:
  podTemplate:
    metadata:
      labels:
        sandbox-type: python-agent
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      nodeSelector:
        sandbox.gke.io/runtime: gvisor
        cloud.google.com/compute-class: agent-sandbox-gvisor
      tolerations:
      - key: sandbox.gke.io/runtime
        operator: Equal
        value: gvisor
        effect: NoSchedule
      restartPolicy: OnFailure
      containers:
      - name: agent-runtime
        image: registry.k8s.io/agent-sandbox/python-runtime-sandbox:v0.1.0
        ports:
        - containerPort: 8888
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: python-agent-warmpool
  namespace: default
spec:
  replicas: 2
  sandboxTemplateRef:
    name: python-agent-gvisor-template
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxClaim
metadata:
  name: agent-session-001
  namespace: default
spec:
  warmPoolRef:
    name: python-agent-warmpool
