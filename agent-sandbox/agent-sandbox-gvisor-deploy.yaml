apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox-gvisor-worker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-sandbox-gvisor-worker
  template:
    metadata:
      labels:
        app: agent-sandbox-gvisor-worker
    spec:
      runtimeClassName: gvisor
      nodeSelector:
        cloud.google.com/compute-class: agent-sandbox-gvisor
      tolerations:
      - key: sandbox.gke.io/runtime
        operator: Equal
        value: gvisor
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: worker
        image: registry.k8s.io/pause:latest
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
