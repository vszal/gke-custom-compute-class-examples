apiVersion: v1
kind: ServiceAccount
metadata:
  name: sbx-demo-dashboard
  namespace: agent-sandbox-demo
  labels:
    app.kubernetes.io/part-of: ccc-agent-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sbx-demo-dashboard-role
  labels:
    app.kubernetes.io/part-of: ccc-agent-sandbox
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "namespaces", "events"]
  verbs: ["get", "list", "watch"]
# Rootfs-only mode reads each session's logged state to show what a resume restored.
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["cloud.google.com"]
  resources: ["computeclasses"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["autoscaling.x-k8s.io"]
  resources: ["capacityquotas", "capacitybuffers"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxclaims", "sandboxwarmpools", "sandboxtemplates"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["podsnapshot.gke.io"]
  resources: ["podsnapshotmanualtriggers", "podsnapshots"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sbx-demo-dashboard-binding
  labels:
    app.kubernetes.io/part-of: ccc-agent-sandbox
subjects:
- kind: ServiceAccount
  name: sbx-demo-dashboard
  namespace: agent-sandbox-demo
roleRef:
  kind: ClusterRole
  name: sbx-demo-dashboard-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbx-demo-dashboard
  namespace: agent-sandbox-demo
  labels:
    app: sbx-demo-dashboard
    app.kubernetes.io/part-of: ccc-agent-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sbx-demo-dashboard
  template:
    metadata:
      labels:
        app: sbx-demo-dashboard
        app.kubernetes.io/part-of: ccc-agent-sandbox
    spec:
      serviceAccountName: sbx-demo-dashboard
      terminationGracePeriodSeconds: 5
      containers:
      - name: dashboard
        image: python:3.11-slim
        command:
        - /bin/bash
        - -c
        - |
          pip install --no-cache-dir -r /app-src/requirements.txt
          mkdir -p /app/static
          cp /app-src/server.py /app/server.py
          cp /app-src/index.html /app/static/index.html
          cp /app-src/app.js /app/static/app.js
          cp /app-src/guide.js /app/static/guide.js
          cp /app-src/styles.css /app/static/styles.css
          cd /app && python3 server.py --host 0.0.0.0 --port 8881
        ports:
        - containerPort: 8881
          name: http
        readinessProbe:
          # The container installs its dependencies before serving, so the pod is not
          # Ready (and `rollout status` / port-forward would be early) until the API answers.
          httpGet:
            path: /api/state
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 60
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: app-volume
          mountPath: /app-src
      volumes:
      - name: app-volume
        configMap:
          name: sbx-demo-dashboard-app
---
apiVersion: v1
kind: Service
metadata:
  name: sbx-demo-dashboard
  namespace: agent-sandbox-demo
  labels:
    app: sbx-demo-dashboard
    app.kubernetes.io/part-of: ccc-agent-sandbox
spec:
  type: ClusterIP
  ports:
  - port: 8881
    targetPort: 8881
    name: http
  selector:
    app: sbx-demo-dashboard
