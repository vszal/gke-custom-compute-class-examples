# Stateless mode. Nothing is restored, so any family and size can serve any sandbox,
# and both runtimes share one wide 5-tier ladder. microVM needs nested virtualization
# (Intel only), which every family here has.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: agent-sandbox-demo-microvm
  labels:
    app.kubernetes.io/part-of: ccc-agent-sandbox
spec:
  nodePoolConfig:
    sandbox:
      type: microvm
    nodeLabels:
      demo: ccc-agent-sandbox
  priorityDefaults:
    enableNestedVirtualization: true
  priorities:
  - machineType: c3-standard-8
    maxPodsPerNode: 32
  - machineType: n4-standard-8
    maxPodsPerNode: 32
  - machineType: c4-standard-8
    maxPodsPerNode: 32
  - machineType: c2-standard-8
    maxPodsPerNode: 32
  - machineFamily: n2
    minCores: 8
    minMemoryGb: 32
    maxPodsPerNode: 32
  activeMigration:
    optimizeRulePriority: false
  autoscalingPolicy:
    consolidationDelayMinutes: 1
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
---
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: agent-sandbox-demo-gvisor
  labels:
    app.kubernetes.io/part-of: ccc-agent-sandbox
spec:
  nodePoolConfig:
    sandbox:
      type: gvisor
    nodeLabels:
      demo: ccc-agent-sandbox
  priorities:
  - machineType: c3-standard-8
    maxPodsPerNode: 32
  - machineType: n4-standard-8
    maxPodsPerNode: 32
  - machineType: c4-standard-8
    maxPodsPerNode: 32
  - machineType: c2-standard-8
    maxPodsPerNode: 32
  - machineFamily: n2
    minCores: 8
    minMemoryGb: 32
    maxPodsPerNode: 32
  activeMigration:
    optimizeRulePriority: false
  autoscalingPolicy:
    consolidationDelayMinutes: 1
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
