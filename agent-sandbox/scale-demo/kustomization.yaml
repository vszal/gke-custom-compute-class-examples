apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Stateless mode. Pod Snapshots modes are installed by install.sh: --mode=snapshots swaps
# 01-04 for the files in snapshots/, and --mode=snapshots-rootfs keeps 00-03 and swaps 04
# for snapshots-rootfs/04-sessions.yaml.
resources:
- manifests/00-namespace.yaml
- manifests/01-compute-class.yaml
- manifests/02-capacity-quotas.yaml
- manifests/03-buffers.yaml
- manifests/04-sandbox-templates.yaml
- manifests/05-dashboard.yaml

configMapGenerator:
- name: sbx-demo-dashboard-app
  namespace: agent-sandbox-demo
  files:
  - server.py=app/server.py
  - index.html=app/static/index.html
  - app.js=app/static/app.js
  - guide.js=app/static/guide.js
  - styles.css=app/static/styles.css
  - requirements.txt=app/requirements.txt
