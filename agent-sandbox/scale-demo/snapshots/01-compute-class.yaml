# Pod Snapshots mode. A whole-pod snapshot restores only on the machine family that took
# it, so this class keeps to ONE family (N4) and falls back on size only. Sessions use
# Guaranteed QoS, which is what lets a snapshot taken on n4-standard-8 restore on
# n4-standard-16 or n4-standard-4.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: agent-sandbox-demo-snapshots
  labels:
    app.kubernetes.io/part-of: ccc-agent-sandbox
spec:
  nodePoolConfig:
    sandbox:
      type: gvisor
    nodeLabels:
      demo: ccc-agent-sandbox
  priorities:
  - machineType: n4-standard-8
    maxPodsPerNode: 32
  - machineType: n4-standard-16
    maxPodsPerNode: 32
  - machineType: n4-standard-4
    maxPodsPerNode: 32
  activeMigration:
    optimizeRulePriority: false
  autoscalingPolicy:
    consolidationDelayMinutes: 1
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
