# Class-wide vCPU cap for the snapshot sessions. There is only one family, so there is
# no per-family cap to spill on: the class falls back by size instead.
apiVersion: autoscaling.x-k8s.io/v1beta1
kind: CapacityQuota
metadata:
  name: sbx-demo-snapshots-cap
  labels:
    app.kubernetes.io/part-of: ccc-agent-sandbox
spec:
  selector:
    matchExpressions:
    - key: cloud.google.com/compute-class
      operator: In
      values:
      - agent-sandbox-demo-snapshots
  limits:
    resources:
      cpu: 192
