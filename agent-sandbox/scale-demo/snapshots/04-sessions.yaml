# Pod Snapshots for the session Sandboxes. Prerequisites (bucket, IAM, the cluster feature):
# https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox-pod-snapshots
# install.sh --mode=snapshots replaces __BUCKET__.
#
# Each agent session is its own Sandbox, created by the control tower from the
# SandboxTemplate below with a `session` label. Restore is keyed by that label, and it has
# to be on the pod when the pod is created, so sessions don't come from a warm pool.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-session
  namespace: agent-sandbox-demo
  labels:
    app.kubernetes.io/part-of: ccc-agent-sandbox
---
apiVersion: podsnapshot.gke.io/v1
kind: PodSnapshotStorageConfig
metadata:
  name: sbx-demo-snapshots
  labels:
    app.kubernetes.io/part-of: ccc-agent-sandbox
spec:
  snapshotStorageConfig:
    gcs:
      bucket: __BUCKET__
      path: sandboxes
---
apiVersion: podsnapshot.gke.io/v1
kind: PodSnapshotPolicy
metadata:
  name: agent-session-whole-pod
  namespace: agent-sandbox-demo
  labels:
    app.kubernetes.io/part-of: ccc-agent-sandbox
spec:
  storageConfigName: sbx-demo-snapshots
  snapshotScope: whole-pod
  selector:
    matchLabels:
      app: agent-session
  snapshotGroupingRules:
    groupByLabelValue:
      labels: [session]
  triggerConfig:
    type: manual
    postCheckpoint: resume
---
# The tower copies spec.podTemplate into each session Sandbox and adds the `session`
# label. Requests equal limits (Guaranteed QoS) so a snapshot restores across sizes.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: agent-session-template
  namespace: agent-sandbox-demo
  labels:
    app.kubernetes.io/part-of: ccc-agent-sandbox
spec:
  podTemplate:
    metadata:
      labels:
        app: agent-session
        app.kubernetes.io/part-of: ccc-agent-sandbox
    spec:
      runtimeClassName: gvisor
      serviceAccountName: agent-session
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      nodeSelector:
        sandbox.gke.io/runtime: gvisor
        cloud.google.com/compute-class: agent-sandbox-demo-snapshots
      tolerations:
      - key: sandbox.gke.io/runtime
        operator: Equal
        value: gvisor
        effect: NoSchedule
      containers:
      - name: agent-runtime
        image: registry.k8s.io/agent-sandbox/python-runtime-sandbox:v0.1.0
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
