apiVersion: v1
kind: Namespace
metadata:
  name: agent-substrate-demo
  labels:
    app.kubernetes.io/part-of: ccc-agents
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workerpools.ate.dev
spec:
  group: ate.dev
  names:
    kind: WorkerPool
    listKind: WorkerPoolList
    plural: workerpools
    singular: workerpool
    shortNames:
    - wp
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      scale:
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              replicas:
                type: integer
                minimum: 0
              template:
                type: object
                x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            properties:
              replicas:
                type: integer
              readyReplicas:
                type: integer
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: actortemplates.ate.dev
spec:
  group: ate.dev
  names:
    kind: ActorTemplate
    listKind: ActorTemplateList
    plural: actortemplates
    singular: actortemplate
    shortNames:
    - at
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              actorType:
                type: string
              workerPoolRef:
                type: object
                required:
                - name
                properties:
                  name:
                    type: string
              actorsPerWorker:
                type: integer
                minimum: 1
              snapshotStrategy:
                type: string
          status:
            type: object
            properties:
              activeActors:
                type: integer
              allocatedWorkers:
                type: integer
