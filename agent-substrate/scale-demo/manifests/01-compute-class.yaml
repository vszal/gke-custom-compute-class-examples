apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: agent-substrate-microvm
  labels:
    app.kubernetes.io/part-of: ccc-agents
spec:
  nodePoolConfig:
    sandbox:
      type: microvm
    nodeLabels:
      ate.dev/sandbox-runtime: microvm
      demo: ccc-agents
  priorityDefaults:
    enableNestedVirtualization: true
  priorities:
  - machineType: c3-standard-8
    maxPodsPerNode: 32
  - machineType: n4-standard-8
    maxPodsPerNode: 32
  - machineType: c4-standard-8
    maxPodsPerNode: 32
  - machineType: c2-standard-8
    maxPodsPerNode: 32
  - machineFamily: n2
    minCores: 8
    minMemoryGb: 32
    maxPodsPerNode: 32
  activeMigration:
    optimizeRulePriority: false
  autoscalingPolicy:
    consolidationDelayMinutes: 1
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
---
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
