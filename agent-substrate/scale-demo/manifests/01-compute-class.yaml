    maxPodsPerNode: 32
  - machineType: n4-standard-8
    maxPodsPerNode: 32
  - machineType: c4-standard-8
    maxPodsPerNode: 32
  - machineType: c2-standard-8
    maxPodsPerNode: 32
  - machineFamily: n2
    minCores: 8
    minMemoryGb: 32
    maxPodsPerNode: 32
  activeMigration:
    optimizeRulePriority: false
