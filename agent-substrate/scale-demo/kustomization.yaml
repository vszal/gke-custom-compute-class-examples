apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- manifests/00-namespace-and-crds.yaml
- manifests/01-compute-class.yaml
- manifests/02-capacity-quotas.yaml
- manifests/03-standby-buffer.yaml
- manifests/04-agent-substrate-pool.yaml
- manifests/05-dashboard.yaml

configMapGenerator:
- name: ccc-agents-dashboard-app
  namespace: agent-substrate-demo
  files:
  - server.py=app/server.py
  - index.html=app/static/index.html
  - app.js=app/static/app.js
  - guide.js=app/static/guide.js
  - styles.css=app/static/styles.css
  - requirements.txt=app/requirements.txt
