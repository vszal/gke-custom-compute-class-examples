# Substrate mode CapacityBuffers. Same names as pause mode where the roles match, so the
# control tower drives both modes the same way:
# - agent-active-buffer: warm headroom on whichever rule the class picks.
# - agent-standby-buffer-<family>: suspended standby nodes, one buffer per family.
# - agent-seed-<family> (microVM only): a microVM worker requests ate.dev/kvm, an extended
#   resource only atelet's device plugin advertises, so the autoscaler cannot scale a
#   family up from zero for it. The tower holds one small pause pod per family that has
#   workers, which brings node #1 up; the workers themselves scale it from there.
apiVersion: v1
kind: PodTemplate
metadata:
  name: agent-microvm-buffer-template
  namespace: agent-substrate-demo
  labels:
    app.kubernetes.io/part-of: ccc-agents
    buffer-tier: active
    sandbox-runtime: microvm
template:
  metadata:
    labels:
      app.kubernetes.io/part-of: ccc-agents
      app: agent-active-buffer-pod
  spec:
    terminationGracePeriodSeconds: 0
    nodeSelector:
      cloud.google.com/compute-class: agent-substrate-microvm
    containers:
    - name: buffer-container
      image: registry.k8s.io/pause:3.9
      resources:
        requests:
          cpu: "6"
          memory: "24Gi"
        limits:
          cpu: "6"
          memory: "24Gi"
---
apiVersion: v1
kind: PodTemplate
metadata:
  name: agent-microvm-buffer-c4
  namespace: agent-substrate-demo
  labels:
    app.kubernetes.io/part-of: ccc-agents
    machine-family: c4
    sandbox-runtime: microvm
template:
  metadata:
    labels:
      app.kubernetes.io/part-of: ccc-agents
      app: agent-standby-buffer-pod
  spec:
    terminationGracePeriodSeconds: 0
    nodeSelector:
      cloud.google.com/compute-class: agent-substrate-microvm
      node.kubernetes.io/instance-type: c4-standard-8
    containers:
