# GPU inference ComputeClass for the vLLM Gemma tutorial.
#
# Priority order follows the recommended ladder for AI/ML INFERENCE serving:
#   (optional) Reservation -> On-Demand -> (optional) Dynamic Workload Scheduler flex-start -> Spot
#
# On-Demand is the PRIMARY priority here, NOT Spot. Accelerator node startup is
# slow (GPU driver install + large image pull + model load), so a Spot preemption
# is far more disruptive to a latency-sensitive serving path than it is for
# stateless CPU work. Spot stays only as a cheap LAST-resort fallback. The
# commented tiers show where a reservation and Dynamic Workload Scheduler flex-start slot in for production.
#
# Hosts one NVIDIA RTX PRO 6000 per g4-standard-48 node, matching the tutorial.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: gpu-inference
spec:
  nodePoolAutoCreation:
    enabled: true
  autoscalingPolicy:
    consolidationDelayMinutes: 1
  priorities:
  # --- (Production) Reservation first: pre-paid capacity, no queue, no preemption.
  #     Uncomment and set your reservation name to make it the top priority.
  # - machineType: g4-standard-48
  #   spot: false
  #   gpu:
  #     type: nvidia-rtx-pro-6000
  #     count: 1
  #   reservations:
  #     affinity: Specific      # Or AnyThenFail (GKE 1.36+). never AnyBestEffort — it consumes On-Demand capacity before evaluating lower priorities
  #     specific:
  #     - name: <YOUR-GPU-RESERVATION>
  #       zones: ['us-central1-a']

  # --- Priority 1: On-Demand — the guaranteed serving path (PRIMARY) ---
  - machineType: g4-standard-48
    spot: false
    gpu:
      type: nvidia-rtx-pro-6000
      count: 1

  # --- (Production) Dynamic Workload Scheduler flex-start slots HERE, between On-Demand and Spot, when a
  #     short provisioning queue is acceptable. Uncomment to use.
  # - machineType: g4-standard-48
  #   flexStart:
  #     enabled: true
  #   capacityCheckWaitTimeSeconds: 1800
  #   gpu:
  #     type: nvidia-rtx-pro-6000
  #     count: 1

  # --- Priority 2: Spot — cheapest, LAST resort. Replicas + a PodDisruptionBudget absorb preemption. ---
  - machineType: g4-standard-48
    spot: true
    gpu:
      type: nvidia-rtx-pro-6000
      count: 1
