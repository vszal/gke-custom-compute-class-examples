# HYBRID: curated manual node pool(s) on top, NAP long-tail fallback underneath.
#
# WHY: your baseline is a node pool you created and curated yourself — backed by a
# reservation/CUD, and/or using a configuration NAP doesn't create for you (precise
# node system / kubelet tuning, a specific disk or networking setup, compact
# placement, etc.). You want pods to fill that pool first. The lower-priority,
# auto-created rules are there purely for SAFETY / OBTAINABILITY: if the curated
# pool is full or unavailable, NAP provisions generic fallback capacity so pods
# don't sit Pending.
#
# INTENT-BASED, NOT NAME-WIRED. The top rule below is intent-based (machineType +
# spot:false). It matches the existing manual pool because that pool carries the
# class label and taint:
#   --node-labels="cloud.google.com/compute-class=hybrid-capacity"
#   --node-taints="cloud.google.com/compute-class=hybrid-capacity:NoSchedule"
# The autoscaler evaluates each priority rule against existing labeled pools first,
# so an intent rule lands on the curated pool with NO pool name in this spec.
#
# WHY INTENT OVER `nodepools:`. You *can* name pools explicitly (commented below).
# But hard-wiring names means node-pool churn — recreating, renaming, blue/green
# rolling a pool — forces you to rewire this class. The intent form keeps working
# as long as the replacement pool carries the same class label/taint and matches
# the intent. Declarative intent in, no manual rewiring.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: hybrid-capacity
spec:
  nodePoolAutoCreation:
    enabled: true            # only the long-tail fallback rules auto-create pools
  priorities:
  # 1) Curated, pre-created baseline. Intent matches the labeled/tainted manual pool.
  - machineType: c4-standard-16
    spot: false
  # --- Explicit-name alternative (contrast; do NOT combine with the rule above):
  # - nodepools: [reserved-c4-pool]   # works, but renaming/recreating the pool
  #                                   # means editing this class — churn = rewiring.
  # 2) Long-tail fallback (NAP-created) for safety / obtainability.
  - machineFamily: c4
    minCores: 8
  - machineFamily: n4
    minCores: 8
  - spot: true
    machineFamily: c4
    minCores: 8
  # When the curated pool reopens, pull pods back up onto it.
  activeMigration:
    optimizeRulePriority: true
  whenUnsatisfiable: ScaleUpAnyway
