# ComputeClass: a dedicated CHEAP pool for non-DaemonSet kube-system pods.
#
# PROBLEM: kube-system pods (metrics-server, coredns, konnectivity-agent, custom
# operators) often have no PodDisruptionBudget and may carry
# cluster-autoscaler.kubernetes.io/safe-to-evict: "false". They land on whatever
# node the scheduler picks first — frequently an expensive GPU/TPU/large node —
# and then pin it forever, blocking consolidation. Autoscaler logs show:
#   noScaleDown ... reason messageId = "no.scale.down.node.pod.kube.system.unmovable"
#
# FIX: route non-DaemonSet system pods to this cheap n4 class. Expensive nodes
# then host only real workloads and can drain freely.
#
# NOTE: there is NO Deployment to apply for this example. The binding is a LABEL
# on the kube-system namespace (see README) — the -non-daemonset variant leaves
# DaemonSets alone, since they must run on every node anyway.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: system-pool
spec:
  nodePoolAutoCreation:
    enabled: true
  # ScaleUpAnyway is intentional: NEVER let priority exhaustion leave a
  # kube-system pod Pending — that can cascade into a cluster-wide outage.
  whenUnsatisfiable: ScaleUpAnyway
  priorities:
  - machineFamily: n4   # IMPORTANT: Align machineFamily with your existing committed use discounts/Reservations
    minCores: 4         # n4-standard-4 (4 vCPU / 16 GB) comfortably holds typical system pods
    spot: false         # never put system pods on Spot — preemption risks control-plane-adjacent disruption
    location:
      # NO `zones` on purpose. Without them the class spans every zone in the
      # cluster's own region, so this file works unchanged in any region.
      # Pinning zones here is a footgun for THIS example in particular: if none
      # of the listed zones is in your cluster's region, no priority can ever
      # match, and `whenUnsatisfiable: ScaleUpAnyway` cannot save you — the
      # kube-system pods routed here stay Pending indefinitely.
      locationPolicy: BALANCED   # spread NODE scale-up across zones so singleton system pods aren't all in one zone
