# ComputeClass configured for Agent Substrate / microVM execution on GKE.
#
# Workloads requesting this class run inside dedicated hardware-isolated microVMs
# (Kata Containers / Cloud Hypervisor via /dev/kvm).
#
# CRD CEL VALIDATION RULE:
# When 'nodePoolConfig.sandbox.type: microvm' is configured, the ComputeClass OpenAPI
# schema strictly requires 'enableNestedVirtualization: true' across all priorities that
# are not pre-existing nodepools. Setting it in 'priorityDefaults' satisfies this requirement.
#
# MACHINE COMPATIBILITY:
# Nested virtualization is supported on Intel-based VM machine families (Haswell+) such as
# n4, c4, c3, n2, and specific AMD series (n4d). It is NOT supported on e2, Arm (c4a, t2a),
# or memory-optimized (m1, m2, m3) instances; those series are rejected by GKE admission.
#
# IMPORTANT: Align machineType / machineFamily priority order with your existing CUDs/Reservations.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: agent-substrate-microvm
spec:
  nodePoolConfig:
    sandbox:
      type: microvm
    nodeLabels:
      ate.dev/sandbox-runtime: microvm
  priorityDefaults:
    enableNestedVirtualization: true
  priorities:
  # Tier 1: 8-core nested-virt compatible shapes
  - machineType: n4-standard-8
  - machineType: c4-standard-8
  - machineType: c3-standard-8
  - machineType: n4d-standard-8
  - machineType: n2-standard-8
  # Tier 2: 16-core shapes for dense microVM consolidation
  - machineType: n4-standard-16
  - machineType: c4-standard-16
  - machineType: c3-standard-16
  - machineType: n2-standard-16
  # Tier 3: Bounded family catch-all for broad zone elasticity
  - machineFamily: n2
    minCores: 8
    minMemoryGb: 32
  activeMigration:
    optimizeRulePriority: true
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
