# Agent Substrate manifests defining WorkerPool and ActorTemplate.
#
# WorkerPool manages pre-warmed worker pods that execute actors inside hardware-isolated
# microVM sandboxes (Kata Containers + Cloud Hypervisor).
#
# Resources allocated to worker pods account for Cloud Hypervisor VMM and virtiofsd
# memory overhead (podFixed overhead of 250m CPU and 130Mi memory).
---
apiVersion: v1
kind: Namespace
metadata:
  name: ate-system
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: agent-substrate-microvm-pool
  namespace: ate-system
spec:
  replicas: 2
  workerImage: ko://go.ate.dev/substrate/cmd/ateworker-microvm
  template:
    nodeSelector:
      cloud.google.com/compute-class: agent-substrate-microvm
      sandbox.gke.io/runtime: microvm
    tolerations:
    - key: sandbox.gke.io/runtime
      operator: Equal
      value: microvm
      effect: NoSchedule
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
---
apiVersion: ate.dev/v1alpha1
kind: ActorTemplate
metadata:
  name: code-interpreter-actor
  namespace: ate-system
spec:
  workerSelector:
    matchLabels:
      ate.dev/worker-pool: agent-substrate-microvm-pool
  containers:
  - name: interpreter
    image: us-docker.pkg.dev/google-samples/containers/gke/hello-app:1.0
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
