# Active + Multi-Family Standby CapacityBuffers for Agent Substrate (microVM & gVisor)
# Includes PodTemplates for both `agent-substrate-microvm` (runtimeClassName: microvm)
# and `agent-substrate-gvisor` (runtimeClassName: gvisor) so the Control Tower can
# live-switch active and standby CapacityBuffers between sandbox runtimes.
apiVersion: v1
kind: PodTemplate
metadata:
  name: agent-microvm-buffer-template
  namespace: agent-substrate-demo
  labels:
    app.kubernetes.io/part-of: ccc-agents
    buffer-tier: active
    sandbox-runtime: microvm
template:
  metadata:
    labels:
      app.kubernetes.io/part-of: ccc-agents
      app: agent-active-buffer-pod
  spec:
    runtimeClassName: microvm
    terminationGracePeriodSeconds: 0
    nodeSelector:
      cloud.google.com/compute-class: agent-substrate-microvm
    tolerations:
    - key: "sandbox.gke.io/runtime"
      operator: "Equal"
      value: "microvm"
      effect: "NoSchedule"
    containers:
    - name: buffer-container
      image: registry.k8s.io/pause:3.9
      resources:
        requests:
          cpu: "6"
          memory: "24Gi"
        limits:
          cpu: "6"
          memory: "24Gi"
---
apiVersion: v1
kind: PodTemplate
metadata:
  name: agent-gvisor-buffer-template
  namespace: agent-substrate-demo
  labels:
    app.kubernetes.io/part-of: ccc-agents
    buffer-tier: active
    sandbox-runtime: gvisor
template:
  metadata:
    labels:
      app.kubernetes.io/part-of: ccc-agents
      app: agent-active-buffer-pod
  spec:
    runtimeClassName: gvisor
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 0
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    nodeSelector:
      cloud.google.com/compute-class: agent-substrate-gvisor
    tolerations:
    - key: "sandbox.gke.io/runtime"
      operator: "Equal"
      value: "gvisor"
      effect: "NoSchedule"
    containers:
    - name: buffer-container
      image: registry.k8s.io/pause:3.9
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      resources:
        requests:
          cpu: "6"
          memory: "24Gi"
        limits:
          cpu: "6"
          memory: "24Gi"
---
apiVersion: autoscaling.x-k8s.io/v1beta1
kind: CapacityBuffer
metadata:
  name: agent-active-buffer
  namespace: agent-substrate-demo
  labels:
    app.kubernetes.io/part-of: ccc-agents
    buffer-strategy: active
spec:
  podTemplateRef:
    name: agent-microvm-buffer-template
  replicas: 2
  provisioningStrategy: "buffer.x-k8s.io/active-capacity"
---
